[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "roommate-ledger"
version = "2.0.0"
description = "Private and shared household ledger API"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "bcrypt>=4.3,<6", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11.2,<13", "email-validator>=2.2,<3", "tzdata>=2025.1",
  "anyio>=4.9,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
