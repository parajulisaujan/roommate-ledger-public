# Zero-cost staging only. Stop if the provider requests a card or any charge.
# Configure provider secrets and protected Vercel Preview before deployment.
services:
  - type: web
    name: roommateledger-staging-api
    runtime: docker
    repo: https://github.com/parajulisaujan/roommate-ledger
    branch: main
    region: ohio
    plan: free
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: off
    # Free has no pre-deploy jobs or shell: validate/migrate before serving on every start.
    dockerCommand: /app/.venv/bin/python -m app.staging_start
    maxShutdownDelaySeconds: 180
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEPLOYMENT_PROXY_REQUIRED
        value: "true"
      - key: DEPLOYMENT_PROXY_KEY
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: TRUSTED_PROXY_CIDRS
        value: ""
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: SMTP_HOST
        value: sandbox.smtp.mailtrap.io
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: ledger-staging@example.test
      - key: SMTP_STARTTLS
        value: "true"
      - key: RECEIPT_PROVIDER
        value: adapter
      - key: RECEIPT_PROVIDER_URL
        value: ""
      - key: RECEIPT_PROVIDER_API_KEY
        value: ""
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_RECEIPT_MODEL
        value: ""
